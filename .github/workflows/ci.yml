name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: test
        run: npm test
      - name: help
        run: node bin/blackout.js help > /dev/null
      - name: smoke
        run: node scripts/smoke.js
      # The unit tests check commands one at a time; this walks the whole surface
      # in three states. It is the only job that would notice a command that
      # still works but no longer returns the exit code the README promises.
      - name: surface
        run: node scripts/surface.js

  # The floors are where the suite is, not where it should be: they exist so a
  # new branch arrives with a test or with a deliberate, argued lowering. Pinned
  # to one runtime because the threshold flags need Node 22 and up.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run coverage
